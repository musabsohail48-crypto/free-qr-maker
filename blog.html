<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>QRForge Blog</title><link rel="stylesheet" href="/styles.css"></head><body><main class="section"><a class="logo" href="/">QR<span>Forge</span></a><h1>QRForge Blog</h1><p class="muted">Guides and practical QR-code tips will appear here.</p><div id="posts" class="grid"></div></main><script>fetch('/api/posts').then(r=>r.json()).then(p=>document.getElementById('posts').innerHTML=p.length?p.map(x=>`<article><h3>${x.title}</h3><p>${x.body}</p></article>`).join(''):'<article><h3>Coming soon</h3><p>Publish your first guide from the admin API.</p></article>')</script></body></html>
