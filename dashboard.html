<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>QRForge Dashboard</title><link rel="stylesheet" href="/styles.css"></head><body><header><a class="logo" href="/">QR<span>Forge</span></a><a class="btn small" href="/" style="margin-left:auto">New QR</a><button id="logout">Logout</button></header><main class="section"><span class="eyebrow">MY WORKSPACE</span><h1>Dashboard</h1><div class="grid" id="stats"></div><h2 style="margin-top:45px">Saved QR codes</h2><div id="list" class="grid"></div></main><script>const token=localStorage.token;if(!token)location.href='/login.html';const H={Authorization:'Bearer '+token};async function load(){let r=await fetch('/api/qrs',{headers:H});if(!r.ok){localStorage.removeItem('token');return location.href='/login.html'}let q=await r.json();document.getElementById('list').innerHTML=q.length?q.map(x=>`<article><b>${x.name}</b><p>Type: ${x.type}</p><p>Created: ${x.created_at}</p><p>Scans: ${x.total_scans||0}</p><button onclick="del(${x.id})">Delete</button></article>`).join(''):'<article><b>No saved codes yet.</b><p>Create a QR and click Save to add it here.</p></article>'}async function del(id){await fetch('/api/qrs/'+id,{method:'DELETE',headers:H});load()}$('logout').onclick=()=>{localStorage.removeItem('token');location.href='/'};load();</script></body></html>
