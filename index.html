<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro QR Code Generator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- QRCode.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex flex-col items-center justify-center p-4 md:p-8">

    <!-- 📢 AD SLOT 1: Top Leaderboard -->
    <div class="max-w-4xl w-full bg-slate-900 border-2 border-dashed border-slate-700 rounded-xl p-4 mb-6 text-center text-slate-500 flex flex-col items-center justify-center min-h-[90px]">
        <span class="text-xs uppercase tracking-widest font-bold mb-1 text-slate-400">Advertisement Slot</span>
        <p class="text-sm">Paste your Google AdSense code here (728x90)</p>
    </div>

    <div class="max-w-4xl w-full bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden grid grid-cols-1 md:grid-cols-12 gap-0">
        
        <!-- Left Panel: Controls & Inputs -->
        <div class="md:col-span-7 p-6 md:p-8 flex flex-col justify-between">
            <div>
                <h1 class="text-2xl font-bold bg-gradient-to-r from-indigo-400 to-pink-500 bg-clip-text text-transparent mb-1">
                    <i class="fa-solid fa-qrcode mr-2"></i>Pro QR Generator
                </h1>
                <p class="text-xs text-slate-400 mb-6">Create customized, high-resolution QR codes instantly.</p>

                <!-- Tabs -->
                <div class="flex flex-wrap gap-2 mb-6 border-b border-slate-800 pb-4">
                    <button onclick="switchTab('url')" id="tab-url" class="tab-btn px-3 py-1.5 text-xs font-semibold rounded-lg bg-indigo-600 text-white transition"><i class="fa-solid fa-link mr-1"></i> URL</button>
                    <button onclick="switchTab('text')" id="tab-text" class="tab-btn px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition"><i class="fa-solid fa-font mr-1"></i> Text</button>
                    <button onclick="switchTab('wifi')" id="tab-wifi" class="tab-btn px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition"><i class="fa-solid fa-wifi mr-1"></i> WiFi</button>
                    <button onclick="switchTab('vcard')" id="tab-vcard" class="tab-btn px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition"><i class="fa-solid fa-address-card mr-1"></i> vCard</button>
                    <button onclick="switchTab('email')" id="tab-email" class="tab-btn px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition"><i class="fa-solid fa-envelope mr-1"></i> Email</button>
                </div>

                <!-- Input Forms -->
                <div id="form-content" class="space-y-4">
                    <!-- Dynamic fields rendered via JS -->
                </div>

                <!-- Customization Options -->
                <div class="mt-6 pt-6 border-t border-slate-800 grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">QR Color</label>
                        <input type="color" id="qr-color" value="#0f172a" onchange="generateQR()" class="w-full h-9 bg-slate-800 border border-slate-700 rounded-lg cursor-pointer">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Background Color</label>
                        <input type="color" id="qr-bg" value="#ffffff" onchange="generateQR()" class="w-full h-9 bg-slate-800 border border-slate-700 rounded-lg cursor-pointer">
                    </div>
                </div>
            </div>

            <!-- Generate Button -->
            <button onclick="generateQR()" class="mt-6 w-full py-3 bg-gradient-to-r from-indigo-600 to-pink-600 hover:from-indigo-500 hover:to-pink-500 text-white font-semibold rounded-xl shadow-lg transition active:scale-[0.98]">
                <i class="fa-solid fa-wand-magic-sparkles mr-2"></i> Generate QR Code
            </button>
        </div>

        <!-- Right Panel: Preview, Download & Ads -->
        <div class="md:col-span-5 bg-slate-950 p-6 md:p-8 flex flex-col items-center justify-center border-t md:border-t-0 md:border-l border-slate-800">
            
            <!-- Professional QR Code Display Box -->
            <div class="bg-white p-4 rounded-2xl shadow-xl flex items-center justify-center mb-6 w-full max-w-[220px] aspect-square">
                <canvas id="qr-canvas" class="w-full h-full"></canvas>
            </div>

            <div class="flex gap-3 w-full mb-6">
                <button onclick="downloadQR('png')" class="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-xl transition shadow-md flex items-center justify-center">
                    <i class="fa-solid fa-download mr-1.5"></i> PNG
                </button>
                <button onclick="downloadQR('jpg')" class="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-xl transition shadow-md flex items-center justify-center">
                    <i class="fa-solid fa-file-image mr-1.5"></i> JPG
                </button>
            </div>

            <!-- 📢 AD SLOT 2: Sidebar Box -->
            <div class="w-full bg-slate-900 border-2 border-dashed border-slate-700 rounded-xl p-4 text-center text-slate-500 flex flex-col items-center justify-center min-h-[200px]">
                <span class="text-[10px] uppercase tracking-widest font-bold mb-1 text-slate-400">Sponsored Ad</span>
                <p class="text-xs">Your 300x250 Ad Here</p>
            </div>
        </div>

    </div>

    <script>
        let currentTab = 'url';

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-indigo-600', 'text-white');
                btn.classList.add('bg-slate-800', 'text-slate-300');
            });
            document.getElementById(`tab-${tab}`).classList.remove('bg-slate-800', 'text-slate-300');
            document.getElementById(`tab-${tab}`).classList.add('bg-indigo-600', 'text-white');
            renderForm();
            generateQR();
        }

        function renderForm() {
            const container = document.getElementById('form-content');
            if (currentTab === 'url') {
                container.innerHTML = `
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Website URL</label>
                        <input type="url" id="in-url" placeholder="https://example.com" value="https://pro-qr-generator.com" oninput="generateQR()" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                    </div>
                `;
            } else if (currentTab === 'text') {
                container.innerHTML = `
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Plain Text / Message</label>
                        <textarea id="in-text" rows="3" placeholder="Enter your text here..." oninput="generateQR()" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-slate-200 focus:outline-none focus:border-indigo-500">Welcome to Pro QR Generator!</textarea>
                    </div>
                `;
            } else if (currentTab === 'wifi') {
                container.innerHTML = `
                    <div class="space-y-3">
                        <div><label class="block text-xs font-medium text-slate-400 mb-1">Network SSID (Name)</label><input type="text" id="wifi-ssid" placeholder="MyWiFiNetwork" oninput="generateQR()" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-slate-200"></div>
                        <div><label class="block text-xs font-medium text-slate-400 mb-1">Password</label><input type="text" id="wifi-pass" placeholder="Password123" oninput="generateQR()" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-slate-200"></div>
                    </div>
                `;
            } else if (currentTab === 'vcard') {
                container.innerHTML = `
                    <div class="space-y-3 grid grid-cols-2 gap-3">
                        <div><label class="block text-xs font-medium text-slate-400 mb-1">First Name</label><input type="text" id="vc-fname" placeholder="John" oninput="generateQR()" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-slate-200"></div>
                        <div><label class="block text-xs font-medium text-slate-400 mb-1">Phone</label><input type="tel" id="vc-phone" placeholder="+1234567890" oninput="generateQR()" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-slate-200"></div>
                    </div>
                `;
            } else if (currentTab === 'email') {
                container.innerHTML = `
                    <div class="space-y-3">
                        <div><label class="block text-xs font-medium text-slate-400 mb-1">Recipient Email</label><input type="email" id="em-to" placeholder="example@domain.com" oninput="generateQR()" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-slate-200"></div>
                        <div><label class="block text-xs font-medium text-slate-400 mb-1">Subject</label><input type="text" id="em-sub" placeholder="Hello" oninput="generateQR()" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-slate-200"></div>
                    </div>
                `;
            }
        }

        function getQRCodeData() {
            let data = "https://pro-qr-generator.com";
            if (currentTab === 'url') data = document.getElementById("in-url")?.value || data;
            else if (currentTab === 'text') data = document.getElementById("in-text")?.value || "Hello!";
            else if (currentTab === 'wifi') {
                const ssid = document.getElementById("wifi-ssid")?.value || "";
                const pass = document.getElementById("wifi-pass")?.value || "";
                data = `WIFI:S:${ssid};T:WPA;P:${pass};;`;
            } else if (currentTab === 'vcard') {
                const fname = document.getElementById("vc-fname")?.value || "";
                const phone = document.getElementById("vc-phone")?.value || "";
                data = `BEGIN:VCARD\nVERSION:3.0\nFN:${fname}\nTEL:${phone}\nEND:VCARD`;
            } else if (currentTab === 'email') {
                const to = document.getElementById("em-to")?.value || "";
                const sub = document.getElementById("em-sub")?.value || "";
                data = `mailto:${to}?subject=${encodeURIComponent(sub)}`;
            }
            return data;
        }

        function generateQR() {
            const data = getQRCodeData();
            const canvas = document.getElementById("qr-canvas");
            const fgColor = document.getElementById("qr-color").value;
            const bgColor = document.getElementById("qr-bg").value;

            QRCode.toCanvas(canvas, data, {
                width: 250,
                margin: 2,
                color: {
                    dark: fgColor,
                    light: bgColor
                }
            }, function (error) {
                if (error) console.error(error);
            });
        }

        function downloadQR(format) {
            const canvas = document.getElementById("qr-canvas");
            const link = document.createElement('a');
            link.download = `Pro-QRCode.${format}`;
            if (format === 'jpg') {
                link.href = canvas.toDataURL("image/jpeg", 1.0);
            } else {
                link.href = canvas.toDataURL("image/png");
            }
            link.click();
        }

        window.onload = () => {
            renderForm();
            generateQR();
        };
    </script>
</body>
</html>
