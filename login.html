<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>QRForge Account</title><link rel="stylesheet" href="/styles.css"></head><body><main class="section" style="max-width:520px"><a class="logo" href="/">QR<span>Forge</span></a><div class="panel" style="margin-top:30px"><h2 id="title">Login</h2><label>Email</label><input id="email" type="email" placeholder="you@example.com"><label>Password</label><input id="password" type="password" placeholder="8+ characters"><button id="submit" class="btn wide">Login</button><p id="msg"></p><button id="switch" class="btn outline wide">Create an account</button></div></main><script>let reg=false;const $=x=>document.getElementById(x);$('switch').onclick=()=>{reg=!reg;$('title').textContent=reg?'Create account':'Login';$('submit').textContent=reg?'Sign up':'Login';$('switch').textContent=reg?'Back to login':'Create an account'};$('submit').onclick=async()=>{const r=await fetch(reg?'/api/register':'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});const d=await r.json();if(!r.ok)return $('msg').textContent=d.error;localStorage.token=d.token;location.href='/dashboard.html'};</script></body></html>
